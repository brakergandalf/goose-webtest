version: "1.0"
name: "auto-discover"
description: "Autonomously discover application structure, generate tests, and execute them — no test spec required"

settings:
  max_retries: 2
  timeout_seconds: 900
  screenshot_on_every_step: true

nodes:
  - id: launch
    type: deterministic
    name: "Launch Browser"
    action:
      type: LaunchBrowser

  - id: login
    type: deterministic
    name: "Authenticate"
    action:
      type: Login

  - id: discover
    type: agentic
    name: "Discover Application Structure"
    prompt: |
      You are exploring a web application. You are ALREADY in the browser and logged in.

      STEP 1: Call browser_snapshot to see the current page.

      STEP 2: Identify ALL navigation links in the main menu.
      In the accessibility tree, look for "link" entries inside "navigation" sections.

      STEP 3: Visit EVERY navigation link. For each one:
        a) browser_click on its [ref=XXX]
        b) browser_snapshot to see the page content
        c) log_step with: page name, URL path, what content is on this page
        d) browser_take_screenshot

      STEP 4: For each page, also check for:
        - Sub-navigation or tabs (click them too)
        - Account lists or data tables
        - Buttons and action items
        - Forms

      STEP 5: Output a JSON summary listing every page you found:
      ```json
      {
        "pages": [
          {
            "name": "Page Name",
            "url_pattern": "partial-url",
            "heading": "Main heading text on this page",
            "key_content": ["item1", "item2"],
            "has_forms": false,
            "has_tables": false,
            "buttons": ["Button Label 1"]
          }
        ]
      }
      ```

      RULES:
      - ALWAYS call browser_snapshot before clicking anything
      - Visit EVERY navigation item — do not skip any
      - Do NOT submit forms or click logout
      - Do NOT navigate to external URLs
    max_turns: 25
    timeout_seconds: 300

  - id: generate_and_execute
    type: agentic
    name: "Generate and Execute Tests"
    prompt: |
      You have a map of this application from the previous discovery step.
      Now generate and execute comprehensive tests.

      YOUR GOAL: Produce at least 20 assertion calls across all pages.

      TESTING STRATEGY — work through EVERY discovered page:

      For EACH page found during discovery:
        1. Navigate to it (browser_click on the navigation link)
        2. browser_snapshot to see the page
        3. assert_url_matches with part of the page URL
        4. assert_visible with the page heading text
        5. assert_visible with at least one key content item on that page
        6. If the page has buttons: assert_visible with the button label
        7. If the page has sub-tabs: click each tab and assert_visible on its content
        8. log_step to record the test result

      ASSERTION TOOL GUIDE:
      - assert_visible("some text") — PREFERRED, most reliable. Checks if text appears anywhere on the page.
      - assert_url_matches("pattern") — Reliable. Checks if URL contains the pattern.
      - assert_text_contains(selector, expected) — Good for specific content checks.
      - assert_element_exists(description, text) — AVOID unless checking for specific element types. This tool is fragile.

      EXAMPLE TEST SEQUENCE for one page:
      ```
      log_step("TC-001: Navigate to Finanzübersicht", "info")
      browser_snapshot
      browser_click [ref=XXX]   (click the navigation link)
      browser_snapshot
      assert_url_matches("finanzuebersicht")
      assert_visible("Finanzübersicht")
      assert_visible("Girokonto")         (key content on this page)
      log_step("TC-001: PASS", "pass")
      ```

      EXECUTION RULES:
      1. Number tests sequentially: TC-001, TC-002, etc.
      2. ALWAYS browser_snapshot before asserting or clicking
      3. Use assert_visible for text checks (NOT assert_element_exists)
      4. At least 3 assertions per page (URL + heading + content)
      5. Take browser_take_screenshot once per page group
      6. Do NOT submit forms or modify any data
      7. Do NOT navigate to external URLs or localhost

      After all tests, provide a summary:
      "Tests complete: X passed, Y failed out of Z total assertions."
    max_turns: 50
    timeout_seconds: 600

  - id: report
    type: deterministic
    name: "Generate Report"
    action:
      type: GenerateReport

transitions:
  - from: launch
    to: login
    condition: OnSuccess
  - from: launch
    to: report
    condition: OnFailure

  - from: login
    to: discover
    condition: OnSuccess
  - from: login
    to: discover
    condition: OnFailure

  - from: discover
    to: generate_and_execute
    condition: OnSuccess
  - from: discover
    to: report
    condition: OnFailure

  - from: generate_and_execute
    to: report
    condition: Always
