version: "1.0"
name: "auto-discover"
description: "Autonomously discover application structure, generate tests, and execute them — no test spec required"

settings:
  max_retries: 2
  timeout_seconds: 600
  screenshot_on_every_step: true

nodes:
  - id: launch
    type: deterministic
    name: "Launch Browser"
    action:
      type: LaunchBrowser

  - id: login
    type: deterministic
    name: "Authenticate"
    action:
      type: Login

  - id: discover
    type: agentic
    name: "Discover Application Structure"
    prompt: |
      You are exploring this web application. You are ALREADY in the browser and logged in.

      STEP 1: Call browser_snapshot RIGHT NOW to see the current page.

      STEP 2: From the snapshot, identify ALL navigation links and menu items.
      The snapshot shows an accessibility tree — look for:
      - "link" entries (navigation menu items)
      - "button" entries (interactive elements)
      - "navigation" sections

      STEP 3: Click EACH navigation link one by one using browser_click with the [ref=XXX] value.
      After clicking each link:
      - Call browser_snapshot to see the new page
      - Use log_step to record: page title, URL, key content areas, forms found
      - Use browser_take_screenshot for visual evidence

      STEP 4: After visiting ALL pages, output a JSON summary:
      ```json
      {
        "title": "Application Name",
        "pages": [
          {
            "path": "/page-url",
            "title": "Page Title",
            "forms": [{"purpose": "Transfer", "fields": [{"label": "Amount", "field_type": "text", "required": true}]}],
            "interactive_elements": ["Button: Export", "Dropdown: Date filter"],
            "requires_auth": true
          }
        ],
        "navigation": [
          {"label": "Menu Item", "url": "/path"}
        ]
      }
      ```

      RULES:
      - ALWAYS start with browser_snapshot — never assume what's on the page
      - Click navigation links using their [ref=XXX] values from the snapshot
      - Do NOT submit any forms or modify data
      - Do NOT click logout
      - Do NOT navigate to external URLs or localhost
      - Visit EVERY navigation item you can see
    max_turns: 25
    timeout_seconds: 300

  - id: generate_and_execute
    type: agentic
    name: "Generate and Execute Tests"
    prompt: |
      Based on the application structure from the previous discovery step, generate and execute test scenarios.

      STEP 1: Call browser_snapshot to see where you are right now.

      STEP 2: For each discovered page, create and execute test cases:

      **Navigation Tests:**
      - Click each navigation link, verify the page loads (use assert_visible to check for page headings)
      - Use assert_url_matches to verify the URL changed

      **Content Tests:**
      - On each page, use assert_visible to verify key content is present
      - Check that data tables have rows, lists have items
      - Verify section headings match expected labels

      **Form Tests (if forms were discovered):**
      - Use assert_element_exists to verify form fields are present
      - Check field labels and types
      - Do NOT submit forms

      **UI Element Tests:**
      - Verify buttons and interactive elements are visible
      - Check that menus expand/collapse correctly

      EXECUTION RULES:
      1. Assign each test a sequential ID: TC-001, TC-002, etc.
      2. Before each test: log_step("TC-XXX: [description]", "info")
      3. Navigate to the relevant page using browser_click on navigation links
      4. Use assert_visible, assert_text_contains, assert_element_exists to validate
      5. Use browser_take_screenshot at key moments
      6. After each test: log_step("TC-XXX: RESULT", "pass") or log_step("TC-XXX: RESULT", "fail")
      7. Do NOT submit forms or modify data
      8. Do NOT navigate to external URLs or localhost
      9. Always use browser_snapshot before interacting with a page

      Execute ALL tests, then provide a final summary with pass/fail counts.
    max_turns: 35
    timeout_seconds: 480

  - id: report
    type: deterministic
    name: "Generate Report"
    action:
      type: GenerateReport

transitions:
  - from: launch
    to: login
    condition: OnSuccess
  - from: launch
    to: report
    condition: OnFailure

  # Login success → discover
  - from: login
    to: discover
    condition: OnSuccess
  # Login failure → still discover (test public pages)
  - from: login
    to: discover
    condition: OnFailure

  - from: discover
    to: generate_and_execute
    condition: OnSuccess
  - from: discover
    to: report
    condition: OnFailure

  - from: generate_and_execute
    to: report
    condition: Always
